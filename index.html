<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Calmpal – Relaxing Nature Sounds & Sleep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background: #000000;
    color: #ffffff;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .device-shell {
    position: relative;
    width: 390px;
    height: 844px;
    background: #000000;
    border-radius: 48px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 0 10px #1a1a1a;
  }

  /* ── 1. Photographic Scenic Backdrop ── */
  .scenic-bg-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image 0.15s ease-out;
    z-index: 1;
  }

  .scenic-vignette-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.22) 0%,
      rgba(0, 0, 0, 0.00) 30%,
      rgba(0, 0, 0, 0.00) 70%,
      rgba(0, 0, 0, 0.45) 100%
    );
    z-index: 2;
    pointer-events: none;
  }

  /* ── Main App Content Layout ── */
  .app-content {
    position: relative;
    z-index: 10;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 0 20px;
  }

  .top-status {
    height: 48px;
    padding-top: 14px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    z-index: 15;
    pointer-events: none;
  }

  /* ── Tap Anywhere Main Area (Play / Pause Handler) ── */
  .main-tap-touch-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    padding-top: 10px;
    padding-bottom: 20px;
  }

  .center-player-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    pointer-events: none;
    transform: translateY(-16px);
  }

  .title-sound-name {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.4px;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
  }

  /* ── Circular Countdown Timer ── */
  .circular-timer-container {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .timer-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }

  .track-ring {
    fill: none;
    stroke: rgba(255, 255, 255, 0.16);
    stroke-width: 3.5;
  }

  .progress-arc {
    fill: none;
    stroke: #ffffff;
    stroke-width: 4.0;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.1s linear;
  }

  .circle-progress-dot {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.95);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .center-digital-time {
    position: relative;
    font-size: 38px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
  }

  /* ── Bottom Action Dock: 3 Buttons (Sounds, Play/Pause, Edit) ── */
  .bottom-action-dock {
    padding-bottom: 44px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 20;
  }

  .playback-controls-bar {
    display: flex;
    align-items: center;
    gap: 26px;
  }

  .dock-round-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    cursor: pointer;
    transition: transform 0.12s, background 0.12s, border-color 0.12s;
  }
  .dock-round-btn:active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.20);
  }

  /* ── 2. Edit Mode View: Solid Black + Top Digital Timer + Canvas Hourglass Waves ── */
  .edit-mode-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000000;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 64px 20px 44px;
  }
  .edit-mode-overlay.active { display: flex; }

  .edit-top-timer-display {
    font-size: 44px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    letter-spacing: -0.5px;
  }

  .fullheight-ruler-viewport {
    width: 100%;
    height: 520px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
  }
  .fullheight-ruler-viewport:active { cursor: grabbing; }

  .ruler-interactive-canvas {
    width: 100%;
    height: 100%;
  }

  .floating-bottom-exit-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    cursor: pointer;
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 120;
    transition: transform 0.12s, background 0.12s;
  }
  .floating-bottom-exit-btn:active {
    transform: translateX(-50%) scale(0.92);
    background: rgba(255, 255, 255, 0.20);
  }

  /* ── 3. Relaxing Sounds Full Page ── */
  .sounds-page-view {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #0f1015;
    z-index: 100;
    display: none;
    flex-direction: column;
  }
  .sounds-page-view.active { display: flex; }

  .sounds-scroll-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 94px;
  }

  .scenic-sound-card {
    position: relative;
    height: 96px;
    width: 100%;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    padding: 0 20px;
    cursor: pointer;
    border-bottom: 1px solid rgba(0, 0, 0, 0.50);
  }

  .scenic-card-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.40), rgba(0,0,0,0.08), rgba(0,0,0,0.40));
    pointer-events: none;
  }

  .scenic-card-content {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .scenic-card-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .scenic-card-title {
    font-size: 16px;
    font-weight: 400;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
  }

  .card-icon-btn {
    background: transparent;
    border: none;
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    transition: transform 0.12s, opacity 0.12s;
  }
  .card-icon-btn:active { transform: scale(0.88); opacity: 0.75; }
</style>
</head>
<body>

<div class="device-shell">
  <!-- Dynamic Scenic Backdrop -->
  <div class="scenic-bg-layer" id="scenic-bg"></div>
  <div class="scenic-vignette-overlay"></div>

  <!-- ── 2. Edit Mode View (Solid Black + Top Timer + Hourglass Wavy Lines + Bottom Checkmark) ── -->

    <div class="edit-top-timer-display" id="edit-top-timer">30:00</div>

    <div class="fullheight-ruler-viewport" id="fullheight-ruler-viewport">
      <canvas class="ruler-interactive-canvas" id="ruler-interactive-canvas" width="390" height="520"></canvas>
    </div>

    <!-- Floating Confirmation Checkmark Button -->
    <button class="floating-bottom-exit-btn" id="exit-edit-btn" title="Confirm Timer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
  </div>

  <!-- ── 1. Main Player Content ── -->
  <div class="app-content" id="main-player-content">
    <!-- Top Status Bar -->
    <div class="top-status">
      <span>9:41</span>
      <span>●●● WiFi 🔋 80%</span>
    </div>

    <!-- Tap Anywhere Zone: Tapping anywhere toggles Play / Pause -->
    <div class="main-tap-touch-zone" id="main-tap-touch-zone" title="Tap anywhere to Play / Pause">
      <div class="center-player-group" id="center-player-group">
        <div class="title-sound-name" id="display-name">Crickets Night</div>

        <!-- Full Circle Timer View (Centered) -->
        <div class="circular-timer-container" id="circle-container">
          <svg class="timer-svg" id="timer-svg" viewBox="0 0 240 240">
            <circle class="track-ring" cx="120" cy="120" r="110"/>
            <circle class="progress-arc" id="progress-arc" cx="120" cy="120" r="110" stroke-dasharray="691.15" stroke-dashoffset="60"/>
          </svg>

          <!-- Pure Minimal Little Circle Dot Knob -->
          <div class="circle-progress-dot" id="circle-progress-dot"></div>

          <div class="center-digital-time" id="display-time">30:00</div>

    <!-- ── Bottom Action Dock: 3 Clean 50px Buttons (Sounds, Play/Pause, Edit Timer) ── -->
    <div class="bottom-action-dock">
      <div class="playback-controls-bar" id="dock-controls">
        <!-- 🎵 1. Relaxing Sounds (50px) -->
        <button class="dock-round-btn" id="open-sounds-btn" title="Relaxing Sounds">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>

        <!-- ⏵/⏸ 2. Play / Pause Button (50px) -->
        <button class="dock-round-btn" id="play-pause-btn" title="Play / Pause">
          <svg id="play-icon" style="display:none;" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>

        <!-- ✏️ 3. Edit Timer Button on the far right (50px) -->
        <button class="dock-round-btn" id="edit-timer-btn" title="Edit Timer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ── 3. Relaxing Sounds Full Page ── -->
  <div class="sounds-page-view" id="sounds-page">
    <div class="sounds-scroll-list" id="sounds-list"></div>

    <!-- Floating Exit (X) Button (50px, subtle glass) -->
    <button class="floating-bottom-exit-btn" id="close-sounds-btn" title="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<script>
// ── Curated Sounds Dataset with Verified HD Photography (1-to-1 Exact Match) ──
const SOUND_BANNERS = [
  { id: 'crickets-night', name: 'Crickets Night', file: 'Sounds/crickets.mp3', img: 'Images/crickets-night.jpg' },
  { id: 'ocean-waves', name: 'Ocean Waves', file: 'Sounds/waves.mp3', img: 'Images/ocean-waves.jpg' },
  { id: 'gentle-rain', name: 'Gentle Rain', file: 'Sounds/light-rain.mp3', img: 'Images/gentle-rain.jpg' },
  { id: 'rain-window', name: 'Rain on Window', file: 'Sounds/rain-on-window.mp3', img: 'Images/rain-window.jpg' },
  { id: 'cozy-campfire', name: 'Cozy Campfire', file: 'Sounds/campfire.mp3', img: 'Images/cozy-campfire.jpg' },
  { id: 'waterfall', name: 'Forest Waterfall', file: 'Sounds/waterfall.mp3', img: 'Images/waterfall.jpg' },
  { id: 'flowing-river', name: 'Flowing River', file: 'Sounds/river.mp3', img: 'Images/flowing-river.jpg' },
  { id: 'forest-birds', name: 'Morning Birds', file: 'Sounds/birds.mp3', img: 'Images/forest-birds.jpg' },
  { id: 'rolling-thunder', name: 'Rolling Thunder', file: 'Sounds/thunder.mp3', img: 'Images/rolling-thunder.jpg' },
  { id: 'heavy-rain', name: 'Heavy Downpour', file: 'Sounds/heavy-rain.mp3', img: 'Images/heavy-rain.jpg' },
  { id: 'rain-canopy', name: 'Rain on Leaves', file: 'Sounds/rain-on-leaves.mp3', img: 'Images/rain-canopy.jpg' },
  { id: 'tropical-jungle', name: 'Tropical Jungle', file: 'Sounds/jungle.mp3', img: 'Images/tropical-jungle.jpg' },
  { id: 'evening-frogs', name: 'Evening Frogs', file: 'Sounds/frog.mp3', img: 'Images/evening-frogs.jpg' },
  { id: 'cat-purr', name: 'Cat Purring', file: 'Sounds/cat-purring.mp3', img: 'Images/cat-purr.jpg' },
  { id: 'howling-wind', name: 'Howling Winter Gale', file: 'Sounds/howling-wind.mp3', img: 'Images/howling-wind.jpg' },
  { id: 'warm-cafe', name: 'Warm Coffee House', file: 'Sounds/cafe.mp3', img: 'Images/warm-cafe.jpg' },
  { id: 'quiet-library', name: 'Quiet Library', file: 'Sounds/library.mp3', img: 'Images/quiet-library.jpg' },
  { id: 'night-village', name: 'Quiet Mountain Village', file: 'Sounds/night-village.mp3', img: 'Images/night-village.jpg' },
  { id: 'temple-sanctuary', name: 'Sacred Temple', file: 'Sounds/temple.mp3', img: 'Images/temple-sanctuary.jpg' },
  { id: 'deep-underwater', name: 'Deep Underwater', file: 'Sounds/underwater.mp3', img: 'Images/deep-underwater.jpg' },
  { id: 'coastal-seagulls', name: 'Coastal Seagulls', file: 'Sounds/seagulls.mp3', img: 'Images/coastal-seagulls.jpg' },
  { id: 'walk-leaves', name: 'Walk on Leaves', file: 'Sounds/walk-on-leaves.mp3', img: 'Images/walk-leaves.jpg' },
  { id: 'water-droplets', name: 'Water Droplets', file: 'Sounds/droplets.mp3', img: 'Images/water-droplets.jpg' },
  { id: 'wind-chimes', name: 'Wind Chimes', file: 'Sounds/wind-chimes.mp3', img: 'Images/wind-chimes.jpg' },
  { id: 'rowing-boat', name: 'Rowing Boat', file: 'Sounds/rowing-boat.mp3', img: 'Images/rowing-boat.jpg' },
  { id: 'boiling-water', name: 'Boiling Water', file: 'Sounds/boiling-water.mp3', img: 'Images/boiling-water.jpg' },
  { id: 'peaceful-lake', name: 'Peaceful Lake', file: 'Sounds/lake.mp3', img: 'Images/peaceful-lake.jpg' }
];

let activeIdx = 0;
let isPlaying = true;
let isEditing = false;
let remainingSeconds = 1800; // 30 minutes default
let totalDuration = 1800;
const MAX_TIME = 14400; // 4 hours

const audioElement = new Audio();
audioElement.loop = true;

// DOM Elements
const scenicBg = document.getElementById('scenic-bg');
const displayName = document.getElementById('display-name');
const displayTime = document.getElementById('display-time');
const progressArc = document.getElementById('progress-arc');
const progressDot = document.getElementById('circle-progress-dot');
const playIcon = document.getElementById('play-icon');
const pauseIcon = document.getElementById('pause-icon');

const editModeOverlay = document.getElementById('edit-mode-overlay');
const editTopTimer = document.getElementById('edit-top-timer');
const exitEditBtn = document.getElementById('exit-edit-btn');
const rulerCanvas = document.getElementById('ruler-interactive-canvas');

const soundsPage = document.getElementById('sounds-page');
const soundsList = document.getElementById('sounds-list');

// ── Time Formatter without Leading Zero on Hours (e.g. 30:00, 1:15:00) ──
function formatTime(secs) {
  const total = Math.max(0, Math.floor(secs));
  const hrs = Math.floor(total / 3600);
  const mins = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = (n) => String(n).padStart(2, '0');
  if (hrs > 0) {
    return `${hrs}:${pad(mins)}:${pad(s)}`;
  }
  return `${pad(mins)}:${pad(s)}`;
}

// ── Render Active Sound ──
function renderActiveSound() {
  const item = SOUND_BANNERS[activeIdx];
  scenicBg.style.backgroundImage = `url('${item.img}')`;
  displayName.textContent = item.name;

  if (audioElement.src !== location.origin + '/' + item.file && !audioElement.src.endsWith(item.file)) {
    audioElement.src = item.file;
  }

  if (isPlaying) {
    audioElement.play().catch(() => {});
    playIcon.style.display = 'none';
    pauseIcon.style.display = 'block';
  } else {
    audioElement.pause();
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
  }
}

// ── Update Circular Clock & Digital Display ──
const CIRCLE_RADIUS = 110;
const CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS; // 691.15

function updateTimerDisplays() {
  const timeStr = formatTime(remainingSeconds);
  displayTime.textContent = timeStr;
  editTopTimer.textContent = timeStr;

  const progress = Math.max(0, Math.min(1, remainingSeconds / MAX_TIME));
  const offset = CIRCUMFERENCE * (1 - progress);
  progressArc.style.strokeDashoffset = offset;

  // Position Dot Knob around circle
  const angle = (progress * 360 - 90) * (Math.PI / 180);
  const cx = 120 + CIRCLE_RADIUS * Math.cos(angle);
  const cy = 120 + CIRCLE_RADIUS * Math.sin(angle);
  progressDot.style.left = `${cx}px`;
  progressDot.style.top = `${cy}px`;
}

function updateCircularDisplayOnly() {
  const timeStr = formatTime(remainingSeconds);
  displayTime.textContent = timeStr;
  editTopTimer.textContent = timeStr;

  const progress = Math.max(0, Math.min(1, remainingSeconds / MAX_TIME));
  const offset = CIRCUMFERENCE * (1 - progress);
  progressArc.style.strokeDashoffset = offset;

  const angle = (progress * 360 - 90) * (Math.PI / 180);
  const cx = 120 + CIRCLE_RADIUS * Math.cos(angle);
  const cy = 120 + CIRCLE_RADIUS * Math.sin(angle);
  progressDot.style.left = `${cx}px`;
  progressDot.style.top = `${cy}px`;
}

// ── Countdown Timer Interval ──
setInterval(() => {
  if (isPlaying && !isEditing && remainingSeconds > 0) {
    remainingSeconds -= 1;
    updateTimerDisplays();
    if (remainingSeconds <= 0) {
      isPlaying = false;
      audioElement.pause();
      renderActiveSound();
    }
  }
}, 1000);

// ── Toggle Play / Pause ──
function togglePlay() {
  isPlaying = !isPlaying;
  if (isPlaying && remainingSeconds <= 0) {
    remainingSeconds = 1800;
  }
  renderActiveSound();
}

// Tap anywhere on the main screen to Play / Pause
document.getElementById('main-tap-touch-zone').addEventListener('click', () => {
  togglePlay();
});

// Dock Play / Pause Button
document.getElementById('play-pause-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  togglePlay();
});

// ── Edit Mode & Canvas Hourglass Wavy Lines ──
let animFrameId = null;
let isDraggingVertical = false;
let pointerCanvasX = 195;
let pointerCanvasY = 260;
let isPointerActive = false;
let scrollVelocity = 0;
let ripples = [];

function addRipple(x, y) {
  ripples.push({ x, y, radius: 0, maxRadius: 160, opacity: 0.65 });
}

function renderRulerCanvas(timestamp) {
  if (!rulerCanvas) return;
  const ctx = rulerCanvas.getContext('2d');
  const w = rulerCanvas.width;
  const h = rulerCanvas.height;
  const midX = w / 2;
  const midY = h / 2;
  const t = timestamp * 0.001;

  ctx.clearRect(0, 0, w, h);

  // Velocity dampening
  scrollVelocity *= 0.92;
  if (Math.abs(scrollVelocity) < 0.001) scrollVelocity = 0;

  // 1. Center Ambient Aura Glow
  const glowGrad = ctx.createRadialGradient(midX, midY, 10, midX, midY, 160);
  glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.14)');
  glowGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.04)');
  glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = glowGrad;
  ctx.fillRect(0, midY - 80, w, 160);

  // 2. Ripples
  for (let r = ripples.length - 1; r >= 0; r--) {
    const rip = ripples[r];
    rip.radius += 3.5;
    rip.opacity *= 0.94;
    if (rip.opacity < 0.01 || rip.radius > rip.maxRadius) {
      ripples.splice(r, 1);
      continue;
    }
    ctx.strokeStyle = `rgba(255, 255, 255, ${rip.opacity * 0.35})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 3. Shimmer Particles (26 particles)
  for (let i = 0; i < 26; i++) {
    const seed = i * 137.5;
    const baseX = ((Math.sin(seed) * 0.5 + 0.5) * (w - 80)) + 40;
    const baseY = midY + Math.cos(seed * 1.3) * 60;
    const driftY = Math.sin(t * 1.8 + seed) * 14.0 - scrollVelocity * 0.45;
    const driftX = Math.cos(t * 1.4 + seed) * 8.0;
    const pX = Math.max(20, Math.min(w - 20, baseX + driftX));
    const pY = baseY + driftY;
    const dist = Math.abs(pY - midY);
    const fade = Math.max(0.0, 1.0 - dist / 85.0);
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.8 + seed);
    const pRadius = 1.0 + pulse * 1.2;

    ctx.fillStyle = `rgba(255, 255, 255, ${0.45 * fade * pulse})`;
    ctx.beginPath();
    ctx.arc(pX, pY, pRadius, 0, Math.PI * 2);
    ctx.fill();
  }

  // 4. Hourglass Wavy Lines (Wide at top & bottom ~180px, Narrow at waist ~75px)
  const lineSpacing = 7.0;
  const numLines = Math.floor(h / lineSpacing);

  for (let i = 0; i < numLines; i++) {
    const y = i * lineSpacing;
    const distToCenter = Math.abs(y - midY);
    const normDist = distToCenter / (h / 2); // 0 at center, 1 at top/bottom

    // Hourglass profile: narrow in the middle, smoothly widening toward ends
    const hourglassCurve = Math.pow(normDist, 1.7);
    const baseLineWidth = 75 + hourglassCurve * 110;

    // Organic wavy undulating movement
    const waveFreq = 0.032;
    const ambientWave = Math.sin(t * 2.4 + y * waveFreq) * (4.0 * (1 - normDist * 0.5) + 2.0);

    // Interactive pointer deflection
    let pointerDeflect = 0;
    if (isPointerActive) {
      const dy = y - pointerCanvasY;
      const dx = midX - pointerCanvasX;
      const pDist = Math.sqrt(dx * dx + dy * dy);
      if (pDist < 130) {
        const factor = 1 - pDist / 130;
        pointerDeflect = Math.sin(factor * Math.PI) * (dx * 0.38);
      }
    }

    // Velocity inertia bowing
    const velocityDeflect = scrollVelocity * Math.cos(normDist * Math.PI * 0.5) * 1.4;

    const currentMidX = midX + ambientWave + pointerDeflect + velocityDeflect;
    const xLeft = currentMidX - baseLineWidth / 2;
    const xRight = currentMidX + baseLineWidth / 2;

    // Subtle brightness fade from center outward
    const centerFocus = Math.exp(-Math.pow(normDist * 1.8, 2));
    const alpha = Math.max(0.16, Math.min(0.95, 0.22 + centerFocus * 0.72));
    const strokeWidth = 1.0 + centerFocus * 0.6;

    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.lineWidth = strokeWidth;
    ctx.beginPath();
    ctx.moveTo(xLeft, y);
    ctx.lineTo(xRight, y);
    ctx.stroke();
  }

  if (isEditing) {
    animFrameId = requestAnimationFrame(renderRulerCanvas);
  }
}

// ── Open / Close Edit Mode ──
document.getElementById('edit-timer-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  isEditing = true;
  editTopTimer.textContent = formatTime(remainingSeconds);
  editModeOverlay.classList.add('active');
  animFrameId = requestAnimationFrame(renderRulerCanvas);
});

exitEditBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  isEditing = false;
  editModeOverlay.classList.remove('active');
  if (animFrameId) cancelAnimationFrame(animFrameId);
  updateTimerDisplays();
});

// ── Drag Up/Down on Hourglass Lines with Velocity & Ripples ──
const rulerViewport = document.getElementById('fullheight-ruler-viewport');
let lastPointerY = 0;

function updatePointerCoords(e) {
  if (!rulerCanvas) return;
  const rect = rulerCanvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  pointerCanvasX = (clientX - rect.left);
  pointerCanvasY = (clientY - rect.top);
}

function handlePointerDown(e) {
  isDraggingVertical = true;
  isPointerActive = true;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  lastPointerY = clientY;
  scrollVelocity = 0;
  updatePointerCoords(e);
  addRipple(pointerCanvasX, pointerCanvasY);

  const onMove = (me) => {
    if (!isDraggingVertical) return;
    const currentY = me.touches ? me.touches[0].clientY : me.clientY;
    const deltaY = lastPointerY - currentY;
    lastPointerY = currentY;

    scrollVelocity = deltaY * 0.85;
    const changeInSeconds = deltaY * 14;
    remainingSeconds = Math.max(60, Math.min(MAX_TIME, remainingSeconds + changeInSeconds));
    totalDuration = remainingSeconds;

    updatePointerCoords(me);
    updateCircularDisplayOnly();
  };

  const onEnd = () => {
    isDraggingVertical = false;
    isPointerActive = false;
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onEnd);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('touchend', onEnd);
  };

  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onEnd);
}

rulerViewport.addEventListener('mousedown', handlePointerDown);
rulerViewport.addEventListener('touchstart', handlePointerDown, { passive: false });
rulerViewport.addEventListener('mousemove', (e) => {
  if (!isDraggingVertical) {
    isPointerActive = true;
    updatePointerCoords(e);
  }
});
rulerViewport.addEventListener('mouseleave', () => {
  if (!isDraggingVertical) isPointerActive = false;
});

// ── Render Sounds Sheet with 1-to-1 HD Cards ──
let previewingIdx = null;
let initialIdx = 0;
let wasPlayingBeforeSheet = true;

function renderSoundsSheet() {
  soundsList.innerHTML = '';
  SOUND_BANNERS.forEach((item, i) => {
    const isThisPreviewing = previewingIdx === i;
    const card = document.createElement('div');
    card.className = 'scenic-sound-card';
    card.style.backgroundImage = `url('${item.img}')`;

    card.innerHTML = `
      <div class="scenic-card-overlay"></div>
      <div class="scenic-card-content">
        <div class="scenic-card-left">
          <button class="card-icon-btn" data-action="preview" title="Preview Sound">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="${isThisPreviewing ? '#ffffff' : 'none'}" stroke="currentColor" stroke-width="2">
              ${isThisPreviewing ? '<rect x="4" y="4" width="16" height="16" rx="2"/>' : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>'}
            </svg>
          </button>
          <div class="scenic-card-title">${item.name}</div>
        </div>
        <button class="card-icon-btn" data-action="play" title="Play Sound">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
      </div>
    `;

    card.querySelector('[data-action="preview"]').addEventListener('click', (e) => {
      e.stopPropagation();
      if (previewingIdx === i) {
        previewingIdx = null;
        audioElement.pause();
      } else {
        previewingIdx = i;
        audioElement.src = item.file;
        audioElement.play().catch(() => {});
      }
      renderSoundsSheet();
    });

    const triggerPlay = () => {
      previewingIdx = null;
      activeIdx = i;
      isPlaying = true;
      renderActiveSound();
      updateTimerDisplays();
      soundsPage.classList.remove('active');
    };

    card.addEventListener('click', triggerPlay);
    soundsList.appendChild(card);
  });
}

document.getElementById('open-sounds-btn').addEventListener('click', () => {
  initialIdx = activeIdx;
  wasPlayingBeforeSheet = isPlaying;
  previewingIdx = null;
  renderSoundsSheet();
  soundsPage.classList.add('active');
});

document.getElementById('close-sounds-btn').addEventListener('click', () => {
  if (previewingIdx !== null) {
    previewingIdx = null;
    activeIdx = initialIdx;
    renderActiveSound();
    if (!wasPlayingBeforeSheet) {
      isPlaying = false;
      audioElement.pause();
    }
  }
  soundsPage.classList.remove('active');
});

// Initial Render
renderActiveSound();
updateTimerDisplays();
</script>
