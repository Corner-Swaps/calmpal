<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Calmpal – Relaxing Nature Sounds & Sleep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background: #000000;
    color: #ffffff;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .device-shell {
    position: relative;
    width: 390px;
    height: 844px;
    background: #000000;
    border-radius: 48px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 0 10px #1a1a1a;
  }

  /* ── 1. Photographic Scenic Backdrop (Static instant cut) ── */
  .scenic-bg-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 1;
  }

  .scenic-vignette-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.22) 0%,
      rgba(0, 0, 0, 0.00) 30%,
      rgba(0, 0, 0, 0.00) 70%,
      rgba(0, 0, 0, 0.45) 100%
    );
    z-index: 2;
    pointer-events: none;
  }

  /* ── Main App Content Layout ── */
  .app-content {
    position: relative;
    z-index: 10;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 0 20px;
  }

  .top-status {
    height: 48px;
    padding-top: 14px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    z-index: 15;
    pointer-events: none;
  }

  /* ── Tap Anywhere Main Area (Play / Pause Handler) ── */
  .main-tap-touch-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    padding-top: 10px;
    padding-bottom: 20px;
  }

  .center-player-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    width: 100%;
  }

  .title-sound-name {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.4px;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    transform: translateY(6px);
  }

  /* ── Circular Countdown Timer (Centered, lowered slightly) ── */
  .circular-timer-container {
    position: relative;
    width: 316px;
    height: 316px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 40px;
  }

  .timer-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }

  .track-ring {
    fill: none;
    stroke: rgba(255, 255, 255, 0.16);
    stroke-width: 3.5;
  }

  .progress-arc {
    fill: none;
    stroke: #ffffff;
    stroke-width: 4.0;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.1s linear;
  }

  .circle-progress-dot {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.95);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .center-digital-time {
    position: relative;
    font-size: 44px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
  }

  /* ── Bottom Action Dock: 3 Clean Buttons (No Black Highlight) ── */
  .bottom-action-dock {
    padding-bottom: 44px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 20;
  }

  .playback-controls-bar {
    display: flex;
    align-items: center;
    gap: 36px;
  }

  .dock-btn {
    width: 48px;
    height: 48px;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.12s;
  }
  .dock-btn:active {
    transform: scale(0.90);
    opacity: 0.8;
  }

  .dock-round-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: transparent;
    border: 1.2px solid rgba(255, 255, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    cursor: pointer;
    transition: transform 0.12s, background 0.12s;
  }
  .dock-round-btn:active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.20);
  }

  /* ── 2. Edit Mode View: Solid Black + Top Digital Timer + Canvas Fluid Waves ── */
  .edit-mode-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000000;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 38px 20px 44px;
  }
  .edit-mode-overlay.active { display: flex; }

  .edit-top-timer-display {
    font-size: 44px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    letter-spacing: -0.5px;
  }

  .fullheight-ruler-viewport {
    position: absolute;
    top: 120px;
    bottom: 110px;
    left: 0;
    width: 100%;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .fullheight-ruler-viewport:active { cursor: grabbing; }

  .ruler-interactive-canvas {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  .floating-bottom-exit-btn {
    width: 50px;
    height: 50px;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    cursor: pointer;
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 120;
    transition: transform 0.12s, opacity 0.12s;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.85));
  }
  .floating-bottom-exit-btn:active {
    transform: translateX(-50%) scale(0.90);
    opacity: 0.8;
  }

  /* ── 3. Relaxing Sounds Full Page ── */
  .sounds-page-view {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #0f1015;
    z-index: 100;
    display: none;
    flex-direction: column;
  }
  .sounds-page-view.active { display: flex; }

  .sounds-scroll-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0;
    margin: 0;
    padding-bottom: 0px;
    scrollbar-width: none;
  }
  .sounds-scroll-list::-webkit-scrollbar { display: none; }

  /* Taller scenic cards (~118px) */
  .scenic-sound-card {
    position: relative;
    height: 118px;
    width: 100%;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    padding: 0 22px;
    cursor: pointer;
    border-bottom: 1px solid rgba(0, 0, 0, 0.50);
    transition: transform 0.12s, filter 0.12s;
  }
  .scenic-sound-card:active {
    transform: scale(0.985);
    filter: brightness(1.15);
  }
  .scenic-sound-card:last-child {
    border-bottom: none;
  }

  .scenic-card-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.45), rgba(0,0,0,0.12), rgba(0,0,0,0.45));
    pointer-events: none;
  }

  .scenic-card-content {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }

  .scenic-card-title {
    font-size: 18px;
    font-weight: 500;
    color: #ffffff;
    letter-spacing: 0.2px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
  }

  .scenic-select-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s ease-out;
  }

  .scenic-sound-card.active .scenic-select-badge {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="device-shell">
  <!-- Dynamic Scenic Backdrop -->
  <div class="scenic-bg-layer" id="scenic-bg"></div>
  <div class="scenic-vignette-overlay"></div>

  <!-- ── 2. Edit Mode View (Solid Black + Top Timer + Fluid Waves + Bottom Checkmark) ── -->
  <div class="edit-mode-overlay" id="edit-mode-overlay">
    <div class="edit-top-timer-display" id="edit-top-timer">30:00</div>

    <div class="fullheight-ruler-viewport" id="fullheight-ruler-viewport">
      <canvas class="ruler-interactive-canvas" id="ruler-interactive-canvas"></canvas>
    </div>

    <!-- Floating Confirmation Checkmark Button (At exact bottom 44px) -->
    <button class="floating-bottom-exit-btn" id="exit-edit-btn" title="Confirm Timer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
  </div>

  <!-- ── 1. Main Player Content ── -->
  <div class="app-content" id="main-player-content">
    <!-- Top Status Bar -->
    <div class="top-status">
      <span>9:41</span>
      <span>●●● WiFi 🔋 80%</span>
    </div>

    <!-- Tap Anywhere Zone: Tapping anywhere toggles Play / Pause -->
    <div class="main-tap-touch-zone" id="main-tap-touch-zone" title="Tap anywhere to Play / Pause">
      <div class="center-player-group" id="center-player-group">
        <!-- Full Circle Timer View (20% Bigger ~316px) -->
        <div class="circular-timer-container" id="circle-container">
          <svg class="timer-svg" id="timer-svg" viewBox="0 0 316 316">
            <circle class="track-ring" cx="158" cy="158" r="144"/>
            <circle class="progress-arc" id="progress-arc" cx="158" cy="158" r="144" stroke-dasharray="904.78" stroke-dashoffset="75"/>
          </svg>

          <!-- Pure Minimal Little Circle Dot Knob -->
          <div class="circle-progress-dot" id="circle-progress-dot"></div>

          <!-- Center Digital Countdown Timer (44px) -->
          <div class="center-digital-time" id="display-time">30:00</div>
        </div>
      </div>
    </div>

    <!-- ── Bottom Action Dock: 3 Clean Buttons (Only Play has circle) ── -->
    <div class="bottom-action-dock">
      <div class="playback-controls-bar" id="dock-controls">
        <!-- 🎵 1. Relaxing Sounds (No circle) -->
        <button class="dock-btn" id="open-sounds-btn" title="Relaxing Sounds">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>

        <!-- ⏵/⏸ 2. Play / Pause Button (No circle) -->
        <button class="dock-btn" id="play-pause-btn" title="Play / Pause">
          <svg id="play-icon" style="display:none;" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="pause-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>

        <!-- ✏️ 3. Edit Timer Button (No circle) -->
        <button class="dock-btn" id="edit-timer-btn" title="Edit Timer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ── 3. Relaxing Sounds Full Page ── -->
  <div class="sounds-page-view" id="sounds-page">
    <div class="sounds-scroll-list" id="sounds-list"></div>

    <!-- Floating Exit (X) Button (At exact bottom 44px matching checkmark) -->
    <button class="floating-bottom-exit-btn" id="close-sounds-btn" title="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<script>
// ── Curated Sounds Dataset with Verified HD Photography (1-to-1 Exact Match) ──
const SOUND_BANNERS = [
  { id: 'crickets-night', name: 'Crickets Night', file: 'Sounds/crickets.mp3', img: 'Images/crickets-night.jpg' },
  { id: 'ocean-waves', name: 'Ocean Waves', file: 'Sounds/waves.mp3', img: 'Images/ocean-waves.jpg' },
  { id: 'gentle-rain', name: 'Gentle Rain', file: 'Sounds/light-rain.mp3', img: 'Images/gentle-rain.jpg' },
  { id: 'rain-window', name: 'Rain on Window', file: 'Sounds/rain-on-window.mp3', img: 'Images/rain-window.jpg' },
  { id: 'cozy-campfire', name: 'Cozy Campfire', file: 'Sounds/campfire.mp3', img: 'Images/cozy-campfire.jpg' },
  { id: 'waterfall', name: 'Forest Waterfall', file: 'Sounds/waterfall.mp3', img: 'Images/waterfall.jpg' },
  { id: 'flowing-river', name: 'Flowing River', file: 'Sounds/river.mp3', img: 'Images/flowing-river.jpg' },
  { id: 'forest-birds', name: 'Morning Birds', file: 'Sounds/birds.mp3', img: 'Images/forest-birds.jpg' },
  { id: 'rolling-thunder', name: 'Rolling Thunder', file: 'Sounds/thunder.mp3', img: 'Images/rolling-thunder.jpg' },
  { id: 'heavy-rain', name: 'Heavy Downpour', file: 'Sounds/heavy-rain.mp3', img: 'Images/heavy-rain.jpg' },
  { id: 'rain-canopy', name: 'Rain on Leaves', file: 'Sounds/rain-on-leaves.mp3', img: 'Images/rain-canopy.jpg' },
  { id: 'tropical-jungle', name: 'Tropical Jungle', file: 'Sounds/jungle.mp3', img: 'Images/tropical-jungle.jpg' },
  { id: 'evening-frogs', name: 'Evening Frogs', file: 'Sounds/frog.mp3', img: 'Images/evening-frogs.jpg' },
  { id: 'cat-purr', name: 'Cat Purring', file: 'Sounds/cat-purring.mp3', img: 'Images/cat-purr.jpg' },
  { id: 'wind-in-trees', name: 'Wind in Trees', file: 'Sounds/wind-in-trees.mp3', img: 'Images/gentle-wind.jpg' },
  { id: 'dune-breeze', name: 'Desert Dune Breeze', file: 'Sounds/wind.mp3', img: 'Images/dune-breeze.jpg' },
  { id: 'howling-wind', name: 'Howling Winter Gale', file: 'Sounds/howling-wind.mp3', img: 'Images/howling-wind.jpg' },
  { id: 'warm-cafe', name: 'Warm Coffee House', file: 'Sounds/cafe.mp3', img: 'Images/warm-cafe.jpg' },
  { id: 'quiet-library', name: 'Quiet Library', file: 'Sounds/library.mp3', img: 'Images/quiet-library.jpg' },
  { id: 'night-village', name: 'Quiet Mountain Village', file: 'Sounds/night-village.mp3', img: 'Images/night-village.jpg' },
  { id: 'temple-sanctuary', name: 'Sacred Temple', file: 'Sounds/temple.mp3', img: 'Images/temple-sanctuary.jpg' },
  { id: 'deep-underwater', name: 'Deep Underwater', file: 'Sounds/underwater.mp3', img: 'Images/deep-underwater.jpg' },
  { id: 'coastal-seagulls', name: 'Coastal Seagulls', file: 'Sounds/seagulls.mp3', img: 'Images/coastal-seagulls.jpg' },
  { id: 'walk-leaves', name: 'Walk on Leaves', file: 'Sounds/walk-on-leaves.mp3', img: 'Images/walk-leaves.jpg' },
  { id: 'water-droplets', name: 'Water Droplets', file: 'Sounds/droplets.mp3', img: 'Images/water-droplets.jpg' }
];

let activeIdx = 0;
let isPlaying = true;
let totalDuration = 1800; // 30 minutes default
let remainingSeconds = 1800;
let isDraggingVertical = false;
let isEditingMode = false;
let previewingIdx = null;
let initialIdx = 0;
let wasPlayingBeforeSheet = true;

const audioElement = new Audio();
audioElement.loop = true;

// DOM Elements
const scenicBg = document.getElementById('scenic-bg');
const displayName = document.getElementById('display-name');
const displayTime = document.getElementById('display-time');
const progressArc = document.getElementById('progress-arc');
const progressDot = document.getElementById('circle-progress-dot');
const playIcon = document.getElementById('play-icon');
const pauseIcon = document.getElementById('pause-icon');

const editModeOverlay = document.getElementById('edit-mode-overlay');
const editTopTimer = document.getElementById('edit-top-timer');
const exitEditBtn = document.getElementById('exit-edit-btn');
const mainPlayerContent = document.getElementById('main-player-content');
const rulerCanvas = document.getElementById('ruler-interactive-canvas');
const rulerCtx = rulerCanvas ? rulerCanvas.getContext('2d') : null;

const soundsPage = document.getElementById('sounds-page');
const soundsList = document.getElementById('sounds-list');

// ── Time Formatter without Leading Zero on Hours (e.g. 30:00, 1:15:00) ──
function formatNoExtraZeroHours(seconds) {
  const total = Math.max(0, Math.floor(seconds));
  const hrs = Math.floor(total / 3600);
  const mins = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  if (hrs > 0) {
    return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  } else {
    return `${mins}:${String(secs).padStart(2, '0')}`;
  }
}

// ── Render Active Sound ──
function renderActiveSound() {
  const item = SOUND_BANNERS[activeIdx];
  if (displayName) displayName.textContent = item.name;
  scenicBg.style.backgroundImage = `url('${item.img}')`;

  if (audioElement.src !== location.origin + '/' + item.file && !audioElement.src.endsWith(item.file)) {
    audioElement.src = item.file;
  }

  if (isPlaying) {
    audioElement.play().catch(() => {});
  } else {
    audioElement.pause();
  }
}

// ── Update Circular Clock & Digital Display (316px diameter) ──
const CIRCLE_RADIUS = 144;
const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS; // ~904.78
const MAX_TIME = 14400; // 4 hours

function updateCircularDisplayOnly() {
  const progress = Math.max(0, Math.min(1, remainingSeconds / MAX_TIME));
  const formatted = formatNoExtraZeroHours(remainingSeconds);

  if (progressArc) {
    const offset = CIRCLE_CIRCUMFERENCE * (1 - progress);
    progressArc.style.strokeDashoffset = offset;
  }

  const angleRad = (progress * 360 - 90) * (Math.PI / 180);
  const cx = 158, cy = 158;
  const kx = cx + CIRCLE_RADIUS * Math.cos(angleRad);
  const ky = cy + CIRCLE_RADIUS * Math.sin(angleRad);

  if (progressDot) {
    progressDot.style.left = `${kx}px`;
    progressDot.style.top = `${ky}px`;
  }
  displayTime.textContent = formatted;
  editTopTimer.textContent = formatted;
}

function updateTimerDisplays() {
  updateCircularDisplayOnly();
  playIcon.style.display = isPlaying ? 'none' : 'block';
  pauseIcon.style.display = isPlaying ? 'block' : 'none';
}

function togglePlay() {
  isPlaying = !isPlaying;
  if (isPlaying && remainingSeconds <= 0) {
    remainingSeconds = 1800;
  }
  if (isPlaying) {
    audioElement.play().catch(() => {});
  } else {
    audioElement.pause();
  }
  updateTimerDisplays();
}

// ── Interactive Fluid Wave Measuring Lines Engine (60fps Canvas) ──
function setupCanvasDPI() {
  if (!rulerCanvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = rulerCanvas.getBoundingClientRect();
  const width = rect.width || 390;
  const height = rect.height || 520;
  rulerCanvas.width = width * dpr;
  rulerCanvas.height = height * dpr;
  if (rulerCtx) {
    rulerCtx.setTransform(1, 0, 0, 1, 0, 0);
    rulerCtx.scale(dpr, dpr);
  }
}
window.addEventListener('resize', setupCanvasDPI);
setupCanvasDPI();

let smoothSeconds = remainingSeconds;
let scrollVelocity = 0;
let isPointerActive = false;
let pointerCanvasX = 195;
let pointerCanvasY = 260;
let animStartTime = performance.now();

// Subtle floating shimmer particles along the focal beam
const NUM_PARTICLES = 16;
const particles = Array.from({ length: NUM_PARTICLES }, () => ({
  x: 80 + Math.random() * 230,
  y: 260 + (Math.random() - 0.5) * 70,
  vx: (Math.random() - 0.5) * 0.25,
  vy: (Math.random() - 0.5) * 0.15,
  radius: 1.0 + Math.random() * 1.5,
  alpha: 0.2 + Math.random() * 0.5,
  phase: Math.random() * Math.PI * 2
}));

// Expanding touch ripples
let activeRipples = [];

function addRipple(x, y) {
  activeRipples.push({
    x: x,
    y: y,
    radius: 4,
    maxRadius: 160,
    speed: 3.2,
    alpha: 0.75
  });
}

function renderInteractiveRulerFrame(now) {
  if (!rulerCtx || !rulerCanvas) return;

  const dpr = window.devicePixelRatio || 1;
  const width = rulerCanvas.width / dpr;
  const height = rulerCanvas.height / dpr;
  const cx = width / 2;
  const cy = height / 2;
  const t = (now - animStartTime) * 0.001;

  // Clear background
  rulerCtx.clearRect(0, 0, width, height);

  // Smooth inertial transition for timer
  smoothSeconds += (remainingSeconds - smoothSeconds) * 0.28;
  scrollVelocity *= 0.88;
  if (Math.abs(scrollVelocity) < 0.001) scrollVelocity = 0;

  // ── 1. Render Center Focal Aura Glow ──
  const focalGlow = rulerCtx.createRadialGradient(cx, cy, 10, cx, cy, 140);
  focalGlow.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
  focalGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
  rulerCtx.fillStyle = focalGlow;
  rulerCtx.fillRect(0, cy - 60, width, 120);

  // Center Reticle Accent Guides on Left & Right
  rulerCtx.fillStyle = 'rgba(255, 255, 255, 0.40)';
  rulerCtx.fillRect(20, cy - 0.75, 8, 1.5);
  rulerCtx.fillRect(width - 28, cy - 0.75, 8, 1.5);

  // ── 2. Render Floating Shimmer Particles along the Center Focal Zone ──
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 50) p.x = width - 50;
    if (p.x > width - 50) p.x = 50;
    if (p.y < cy - 65) p.y = cy + 65;
    if (p.y > cy + 65) p.y = cy - 65;

    const pDist = Math.abs(p.y - cy);
    const pFade = Math.max(0, 1 - pDist / 65);
    const pPulse = 0.5 + 0.5 * Math.sin(t * 2.5 + p.phase);
    rulerCtx.beginPath();
    rulerCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    rulerCtx.fillStyle = `rgba(255, 255, 255, ${p.alpha * pFade * pPulse})`;
    rulerCtx.shadowBlur = 6;
    rulerCtx.shadowColor = 'rgba(255, 255, 255, 0.8)';
    rulerCtx.fill();
    rulerCtx.shadowBlur = 0;
  });

  // ── 3. Update & Draw Active Ripple Waves ──
  for (let r = activeRipples.length - 1; r >= 0; r--) {
    const rip = activeRipples[r];
    rip.radius += rip.speed;
    rip.alpha *= 0.95;

    rulerCtx.beginPath();
    rulerCtx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
    rulerCtx.strokeStyle = `rgba(255, 255, 255, ${rip.alpha * 0.25})`;
    rulerCtx.lineWidth = 1.5;
    rulerCtx.stroke();

    if (rip.alpha < 0.02 || rip.radius > rip.maxRadius) {
      activeRipples.splice(r, 1);
    }
  }

  // ── 4. Render Animated Organic Fluid Wave Measuring Lines (Always Full Height to Checkmark) ──
  const lineSpacing = 18;
  const numLines = Math.ceil(height / lineSpacing) + 4;
  const offsetPx = (smoothSeconds * (18 / 90)) % lineSpacing;

  for (let i = -2; i <= numLines; i++) {
    const yPos = i * lineSpacing - offsetPx;
    if (yPos < -20 || yPos > height + 20) continue;

    const distFromCenter = Math.abs(yPos - cy);
    const focus = Math.max(0, Math.exp(-Math.pow(distFromCenter / 95, 2)));

    // Smooth elegant bottleneck width profile (65px at ends -> 170px in center)
    const lineWidth = 65 + focus * 105;
    const numPts = 24;
    const xStart = cx - lineWidth / 2;

    rulerCtx.beginPath();
    for (let p = 0; p <= numPts; p++) {
      const u = p / numPts;
      const x = xStart + u * lineWidth;
      const relX = (x - cx) / (lineWidth / 2);
      const envelope = Math.max(0, 1 - relX * relX);

      const wave = Math.sin(t * 2.8 + yPos * 0.035 + relX * 2.2) * (2.0 + focus * 5.0) * envelope;

      let pointerDeflect = 0;
      if (isPointerActive) {
        const dx = x - pointerCanvasX;
        const dy = yPos - pointerCanvasY;
        const distToPoint = Math.hypot(dx, dy);
        if (distToPoint < 110) {
          const force = (1 - distToPoint / 110);
          pointerDeflect = force * Math.max(-25, Math.min(25, pointerCanvasY - yPos)) * 0.35 * envelope;
        }
      }

      const clampedVelocity = Math.max(-10, Math.min(10, scrollVelocity));
      const velocityBow = -clampedVelocity * focus * envelope * 2.5;
      const finalY = yPos + wave + pointerDeflect + velocityBow;

      if (p === 0) {
        rulerCtx.moveTo(x, finalY);
      } else {
        rulerCtx.lineTo(x, finalY);
      }
    }

    const lineAlpha = 0.12 + focus * 0.88;
    rulerCtx.strokeStyle = `rgba(255, 255, 255, ${lineAlpha})`;
    rulerCtx.lineWidth = 1.0 + focus * 0.7;
    rulerCtx.lineCap = 'round';

    if (focus > 0.35) {
      rulerCtx.shadowColor = focus > 0.85 ? 'rgba(255, 255, 255, 0.90)' : 'rgba(255, 255, 255, 0.45)';
      rulerCtx.shadowBlur = focus > 0.85 ? 8 : 4 * focus;
    } else {
      rulerCtx.shadowBlur = 0;
    }

    rulerCtx.stroke();
    rulerCtx.shadowBlur = 0;
  }

  document.getElementById('edit-top-timer').textContent = formatNoExtraZeroHours(remainingSeconds);
  requestAnimationFrame(renderInteractiveRulerFrame);
}

requestAnimationFrame(renderInteractiveRulerFrame);

// ── Edit Button: Switches between Main Player and Edit Mode Overlay ──
const editBtn = document.getElementById('edit-timer-btn');

function toggleEditMode(enable) {
  isEditingMode = enable !== undefined ? enable : !isEditingMode;
  if (isEditingMode) {
    mainPlayerContent.style.display = 'none';
    editModeOverlay.classList.add('active');
    setupCanvasDPI();
  } else {
    mainPlayerContent.style.display = 'flex';
    editModeOverlay.classList.remove('active');
  }
  updateTimerDisplays();
}

editBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleEditMode(true);
});

exitEditBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleEditMode(false);
});

// ── Drag Up/Down on Full-Height Measuring Lines with Fluid Clamped Gesture ──
const rulerViewport = document.getElementById('fullheight-ruler-viewport');
let lastPointerY = 0;

function updatePointerCoords(e) {
  if (!rulerCanvas) return;
  const rect = rulerCanvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  pointerCanvasX = (clientX - rect.left);
  pointerCanvasY = (clientY - rect.top);
}

function handlePointerDown(e) {
  isDraggingVertical = true;
  isPointerActive = true;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  lastPointerY = clientY;
  scrollVelocity = 0;
  updatePointerCoords(e);
  addRipple(pointerCanvasX, pointerCanvasY);

  const onMove = (me) => {
    if (!isDraggingVertical) return;
    const currentY = me.touches ? me.touches[0].clientY : me.clientY;
    const rawDeltaY = lastPointerY - currentY;
    const deltaY = Math.max(-20, Math.min(20, rawDeltaY));
    lastPointerY = currentY;

    scrollVelocity = deltaY * 0.75;
    const changeInSeconds = deltaY * 10;
    remainingSeconds = Math.max(60, Math.min(MAX_TIME, remainingSeconds + changeInSeconds));
    totalDuration = remainingSeconds;

    updatePointerCoords(me);
    updateCircularDisplayOnly();
  };

  const onEnd = () => {
    isDraggingVertical = false;
    isPointerActive = false;
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onEnd);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('touchend', onEnd);
  };

  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onEnd);
}

rulerViewport.addEventListener('mousedown', handlePointerDown);
rulerViewport.addEventListener('touchstart', handlePointerDown, { passive: false });
rulerViewport.addEventListener('mousemove', (e) => {
  if (!isDraggingVertical) {
    isPointerActive = true;
    updatePointerCoords(e);
  }
});
rulerViewport.addEventListener('mouseleave', () => {
  if (!isDraggingVertical) isPointerActive = false;
});

// ── Play / Pause Button in Dock ──
document.getElementById('play-pause-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  togglePlay();
});

// ── Tap Anywhere on Main Screen to Pause / Play ──
document.getElementById('main-tap-touch-zone').addEventListener('click', (e) => {
  togglePlay();
});

// ── Render Sounds Sheet with 1-to-1 HD Taller Cards (118px) ──
function renderSoundsSheet() {
  soundsList.innerHTML = '';
  SOUND_BANNERS.forEach((item, i) => {
    const isThisActive = activeIdx === i;
    const card = document.createElement('div');
    card.className = `scenic-sound-card ${isThisActive ? 'active' : ''}`;
    card.style.backgroundImage = `url('${item.img}')`;

    card.innerHTML = `
      <div class="scenic-card-overlay"></div>
      <div class="scenic-card-content">
        <div class="scenic-card-title">${item.name}</div>
        <div class="scenic-select-badge" title="Selected">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
      </div>
    `;

    // Clicking anywhere on the card/title/select badge selects and plays automatically
    card.addEventListener('click', () => {
      activeIdx = i;
      isPlaying = true;
      renderActiveSound();
      updateTimerDisplays();
      soundsPage.classList.remove('active');
    });

    soundsList.appendChild(card);
  });
}

document.getElementById('open-sounds-btn').addEventListener('click', () => {
  renderSoundsSheet();
  soundsPage.classList.add('active');
});

document.getElementById('close-sounds-btn').addEventListener('click', () => {
  soundsPage.classList.remove('active');
});

// Timer countdown loop (Stops automatically when isPlaying is false)
setInterval(() => {
  if (isPlaying && !isDraggingVertical && !isEditingMode) {
    if (remainingSeconds > 0) {
      remainingSeconds -= 1;
      updateTimerDisplays();
    } else {
      isPlaying = false;
      audioElement.pause();
      updateTimerDisplays();
    }
  }
}, 1000);

// Initial Render
renderActiveSound();
updateTimerDisplays();
</script>
